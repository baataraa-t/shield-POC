name: E2E on Vercel Preview

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  pull-requests: write

jobs:
  e2e:
    if: >
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Show target
        run: |
          echo "Preview URL: ${{ github.event.deployment_status.target_url }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          if [ -n "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            echo "Bypass secret configured: yes"
          else
            echo "Bypass secret configured: no"
          fi

      - name: Find PR for this commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.deployment.sha,
            });
            const open = prs.find((p) => p.state === "open") ?? prs[0];
            if (!open) {
              core.info("No PR found for this commit, skipping comment.");
              return "";
            }
            core.info(`Found PR #${open.number}`);
            return String(open.number);
          result-encoding: string

      - name: Checkout deployed ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Comment on PR
        if: always() && steps.pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const prNumber = Number("${{ steps.pr.outputs.result }}");
            const testsPassed = "${{ steps.tests.outcome }}" === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            function allSpecs(suites) {
              return suites.flatMap((s) => [...(s.specs ?? []), ...allSpecs(s.suites ?? [])]);
            }

            let summaryLine = testsPassed ? "✅ All tests passed" : "❌ Some tests failed";
            let details = "";
            try {
              const results = JSON.parse(fs.readFileSync("playwright-report/results.json", "utf8"));
              const specs = allSpecs(results.suites);
              const total = results.stats.expected + results.stats.unexpected + results.stats.flaky + results.stats.skipped;
              summaryLine = `${testsPassed ? "✅" : "❌"} **${results.stats.expected}/${total} passed** (${(results.stats.duration / 1000).toFixed(1)}s)`;

              const failed = specs.filter((spec) => spec.tests?.some((t) => t.status === "unexpected"));
              if (failed.length) {
                details = "\n\n**Failed:**\n" + failed.map((s) => `- \`${s.title}\``).join("\n");
              }
            } catch (e) {
              core.info(`Could not parse results.json: ${e}`);
            }

            const marker = "<!-- e2e-preview-report -->";
            const body = [
              marker,
              "## 🎭 Playwright E2E — Preview Deployment",
              "",
              summaryLine + details,
              "",
              `Preview tested: ${{ github.event.deployment_status.target_url }}`,
              `[Full HTML report](${runUrl}) (download the \`playwright-report\` artifact)`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
